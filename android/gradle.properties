org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Pakai JDK 21 (lokal, berisi javac). Fedora default hanya menyediakan JRE (java-25-openjdk tanpa compiler).
org.gradle.java.home=/home/savero/.jdks/jdk-21.0.12.1+1
# Biarkan abiFilters pada app/build.gradle.kts berlaku (arm64-v8a saja) dan
# jangan biarkan Flutter Gradle Plugin memaksa semua ABI.
disable-abi-filtering=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
