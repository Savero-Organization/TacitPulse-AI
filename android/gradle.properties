org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Membutuhkan JDK 21 (berisi javac). Path JDK diambil dari JAVA_HOME;
# untuk override per-mesin, set org.gradle.java.home di ~/.gradle/gradle.properties.
# Biarkan abiFilters pada app/build.gradle.kts berlaku (arm64-v8a saja) dan
# jangan biarkan Flutter Gradle Plugin memaksa semua ABI.
disable-abi-filtering=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
