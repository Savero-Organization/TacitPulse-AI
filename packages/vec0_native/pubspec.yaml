name: vec0_native
description: >
  Code asset sqlite-vec (vec0) untuk macOS & iOS lewat build hook.
  Android, Linux, dan Windows membangun vec0 sendiri lewat CMake aplikasi.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.3

dependencies:
  code_assets: ^1.1.0
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.0
